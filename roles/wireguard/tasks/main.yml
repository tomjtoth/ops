---
- name: Ensure wireguard is installed
  package:
    name: >-
      {{
      'wireguard' if ansible_facts.distribution == "Ubuntu"
      else 'wireguard-tools'
      }}
    state: present

- name: Ensure wireguard directory exists
  file:
    path: /etc/wireguard
    state: directory
    mode: "0700"

- name: Rotate private key
  shell: |
    umask 077
    wg genkey
  register: privatekey_raw

- name: Derive public key
  shell: echo "{{ privatekey_raw.stdout | trim }}" | wg pubkey
  register: publickey_raw

- name: Set WireGuard facts
  ansible.builtin.set_fact:
    wg_private_key: "{{ privatekey_raw.stdout | trim }}"
    wg_public_key: "{{ publickey_raw.stdout | trim }}"
    wg_endpoint: "{{ inventory_hostname }}.ttj.hu"
    wg_ip: "{{ wg_ip | default(wg_roaming_ip) }}"
    wg_roaming: "{{ wg_roaming_ip is defined }}"
    wg_proxies: "{{ wg_proxies | split(',') if wg_proxies is defined else [] }}"

- name: Initialize peer list
  ansible.builtin.set_fact:
    wg_peers: {}

- name: Build peer list
  ansible.builtin.set_fact:
    wg_peers: >-
      {{
        wg_peers | combine({
          item: {
            "wg_public_key": hostvars[item].wg_public_key,
            "wg_endpoint": hostvars[item].wg_endpoint,
            "wg_ip": hostvars[item].wg_ip,
            "wg_roaming": hostvars[item].wg_roaming,
            "wg_proxies": hostvars[item].wg_proxies
          }
        })
      }}
  loop: "{{ groups['all'] }}"
  when:
    - item != inventory_hostname
    - hostvars[item].wg_ip is defined

- name: Render wg0.conf
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify:
    - reload wireguard daemon
    - restart wireguard

- name: on Alpine
  include_tasks: alpine.yml
  when: ansible_facts.distribution == 'Alpine'
